name: ONCE acceptance

on:
  pull_request:
    # Stacked feature PRs can validate before the already-tested A1 PR is merged.
    branches: [main, codex/external-agent-collection-work-pr04c, codex/external-agent-media-ingestion-pr04b, codex/external-agent-ingestion-pr04a, codex/talent-experience-pr03, acceptance/browser-resume-ci, feat/controlled-handoff, feat/private-media, feat/works-projects, feat/search-shortlists, feat/search-facts-sql, feat/export-dependencies, feat/deletion-impact-preview, feat/deletion-blocking, feat/deletion-retention-plan, feat/deletion-cleaning, feat/deletion-finalization, feat/person-merge, feat/json-rebuild, feat/restore-drill, feat/restore-check, feat/recovery-approval, feat/recovery-writeahead-media]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: once-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Browser suites retain their business assertions; shared type/core checks run in flow-review.
  browser-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONCE_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify committed delivery fingerprints
        run: sha256sum -c MANIFEST.sha256
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL=postgresql://once_schema_check:syntax_only@127.0.0.1:1/once_validate pnpm exec prisma validate && pnpm db:generate
      - run: docker pull postgres:16-bookworm
      - run: pnpm build && pnpm typecheck:transport
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test tests/acceptance/checkpoint.test.mjs
      - run: pnpm test:postgres:owned --browser-suite resume

      - name: Preserve owned resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-browser-resume-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            data/local-resource-runs/**/*.json
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.png' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpeg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.webp' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.gif' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.webm' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.mp4' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.mov' || '__foundation_no_exclusion__' }}
          retention-days: ${{ github.head_ref == 'codex/once-admin-foundation' && 3 || 0 }}
          if-no-files-found: error

  # A separate owned database; no browser suite shares its populated target.
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ONCE_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
