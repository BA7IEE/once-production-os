name: ONCE acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: once_ci
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: once_test_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U once_ci -d once_test_browser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Set isolated database target
        env:
          CI_DB_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          echo "::add-mask::$CI_DB_PASSWORD"
          echo "DATABASE_URL_TEST=postgresql://once_ci:$CI_DB_PASSWORD@127.0.0.1:5432/once_test_browser" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://once_ci:$CI_DB_PASSWORD@127.0.0.1:5432/once_test_browser" >> "$GITHUB_ENV"
          echo "ALLOW_BROWSER_TESTS=yes" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate && pnpm db:generate
      - run: pnpm verify && pnpm typecheck:transport
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:browser
