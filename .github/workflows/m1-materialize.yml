name: M1 one-time reviewed source transfer
on:
  push:
    branches: [feat/private-media]
    paths: [.github/workflows/m1-materialize.yml]
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/private-media'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify every source edit and publish only to this development branch
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          branch = 'refs/heads/feat/private-media'
          assert os.environ['GITHUB_REF'] == branch
          head = os.environ['GITHUB_SHA']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == head
          chunks = [pathlib.Path('.m1-transfer') / ('part-%02d.bin' % i) for i in range(6)]
          packed = b''.join(p.read_bytes() for p in chunks)
          assert len(packed) == 43508
          assert hashlib.sha256(packed).hexdigest() == '41f471794a97c2a4a0682e40aa50194a6ebda49af494265f42e9f4d8a3cfd1e3'
          dec = lzma.LZMADecompressor(memlimit=100000000)
          raw = dec.decompress(packed, max_length=185531)
          assert dec.eof and not dec.unused_data and len(raw) == 185530
          bundle = json.loads(raw)
          assert bundle['base'] == '683b9a18d5fbd1e9b465bb3ef5b46737978ab8ab'
          assert len(bundle['files']) == 45
          allowed_roots = {'.dockerignore', '.env.example', '.gitignore', 'AGENTS.md', 'MANIFEST.sha256', 'README.md', 'package.json', 'pnpm-lock.yaml'}
          prepared = {}
          for f in bundle['files']:
              rel = pathlib.PurePosixPath(f['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and str(rel) == f['path']
              assert f['path'] in allowed_roots or f['path'].startswith(('apps/', 'packages/', 'prisma/', 'tests/', 'docs/release/', 'scripts/')) or f['path'] in {'.github/workflows/acceptance.yml', 'artifacts/openapi.json'}
              assert f['path'] not in prepared
              path = root.joinpath(rel)
              assert not path.is_symlink() and all(not p.is_symlink() for p in path.parents if p != root.parent)
              old = path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if path.exists() else None) == f['before'], f['path']
              text = old.decode('utf-8')
              last_end = 0
              for e in f['edits']:
                  assert 0 <= last_end <= e['start'] <= e['end'] <= len(text)
                  last_end = e['end']
              for e in reversed(f['edits']):
                  text = text[:e['start']] + e['text'] + text[e['end']:]
              final = text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest() == f['after'], f['path']
              prepared[f['path']] = final
          assert git('ls-remote', 'origin', branch).split()[0] == head
          for rel, data in prepared.items():
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          temporary = chunks + [pathlib.Path('.github/workflows/m1-materialize.yml'), pathlib.Path('.github/workflows/media-source-snapshot.yml')]
          for path in temporary:
              path.unlink()
          subprocess.run(['sha256sum', '-c', 'MANIFEST.sha256'], check=True)
          subprocess.run(['git', 'add', '--', *prepared, *(str(p) for p in temporary)], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat(media): implement private image ingestion and reviewed previews'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], check=True)
          print('Applied 45 hash-verified files; removed all one-time transfer files.')
          PY
