name: ONCE business flow repair acceptance
on:
  pull_request:
    branches: [main, codex/admin-ux-solution]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: once-flow-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ONCE_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify delivery fingerprints
        run: sha256sum -c MANIFEST.sha256
      - name: Start fresh evidence for this head
        run: |
          rm -rf artifacts/admin-ux artifacts/business-flow artifacts/talent-experience-pr02b artifacts/flow-review artifacts/business-flow-review artifacts/agent-ingestion-pr04a
          rm -f artifacts/core-test-report.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Contract, static checks and build
        run: pnpm contract:check && pnpm review:static && pnpm build
      - name: Resource supervision regression
        run: pnpm test:lifecycle
      - run: docker pull postgres:16-bookworm
      - name: Real PostgreSQL transactions and capacity
        run: pnpm test:postgres:owned --admin-ux
      - name: Real rejection and identity transaction regression
        run: pnpm test:postgres:owned --flow-review-db
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real admin, portal, Agent, AI and maintenance journeys
        run: pnpm test:postgres:owned --flow-review-browser
      - name: Preserve current run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/business-flow-review/
            artifacts/flow-review/
            artifacts/admin-ux/
            artifacts/agent-ingestion-pr04a/
            artifacts/business-flow/
            artifacts/talent-experience-pr02b/
            data/local-resource-runs/*/run.json
            data/local-resource-runs/*/process-*.json
            data/local-resource-runs/*/temporary-*.json
            data/local-resource-runs/*/browser-*.json
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.png' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpeg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.webp' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.gif' || '__foundation_no_exclusion__' }}
          retention-days: ${{ github.head_ref == 'codex/once-admin-foundation' && 3 || 0 }}
          if-no-files-found: error
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ONCE_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify delivery fingerprints
        run: sha256sum -c MANIFEST.sha256
      - run: rm -f artifacts/core-test-report.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Full types and core regression
        run: node scripts/heavy-task.mjs pnpm typecheck && node scripts/heavy-task.mjs pnpm test:core
      - name: Preserve this head's core evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-review-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/core-test-report.json
            data/local-resource-runs/*/run.json
            data/local-resource-runs/*/process-*.json
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.png' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.jpeg' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.webp' || '__foundation_no_exclusion__' }}
            !${{ github.head_ref == 'codex/once-admin-foundation' && '**/*.gif' || '__foundation_no_exclusion__' }}
          retention-days: ${{ github.head_ref == 'codex/once-admin-foundation' && 3 || 0 }}
          if-no-files-found: error
