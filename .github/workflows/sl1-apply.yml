name: SL1 apply prepared product patch

on:
  push:
    branches: [feat/internal-shortlists]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/internal-shortlists
          fetch-depth: 0
      - name: Rebuild and verify prepared patch
        run: |
          cat .sl1-patch/p00 .sl1-patch/p01 .sl1-patch/p02 .sl1-patch/p03 .sl1-patch/p04 .sl1-patch/p05 .sl1-patch/p06 | base64 -d | gzip -d > /tmp/sl1.patch
          echo "10688164db745feb2437ecb598541c855e8e2352c965d71b7fbee74e3e1c211e  /tmp/sl1.patch" | sha256sum -c -
          git apply -p1 --check /tmp/sl1.patch
      - name: Apply product patch except workflow file
        run: |
          cp .github/workflows/acceptance.yml /tmp/acceptance.yml
          git apply -p1 /tmp/sl1.patch
          cp /tmp/acceptance.yml .github/workflows/acceptance.yml
          rm -rf .sl1-patch
          rm -f .sl1-trigger
          sha256sum -c MANIFEST.sha256
      - name: Commit product tree
        run: |
          git config user.name "David 老灯"
          git config user.email "32892836+BA7IEE@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(shortlists): add internal candidate collaboration"
          git push origin HEAD:feat/internal-shortlists
