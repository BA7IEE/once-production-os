name: SR1 final compare snapshot
on:
  push:
    branches: [dev/sr1-final-compare]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: sr1-current-tree
          path: |
            .
            !.git/**
            !.github/workflows/sr1-final-compare.yml
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
