name: WP1 one-time reviewed source transfer
on:
  push:
    branches: [feat/works-projects]
    paths: [.github/workflows/wp1-materialize.yml, '.wp1-transfer/**']
permissions:
  contents: write
jobs:
  apply-reviewed-source:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/works-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source bytes and update only this development branch
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          branch = 'refs/heads/feat/works-projects'
          assert os.environ['GITHUB_REF'] == branch
          assert os.environ['GITHUB_REPOSITORY'] == 'BA7IEE/once-production-os'
          head = os.environ['GITHUB_SHA']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == head
          chunks = [pathlib.Path('.wp1-transfer') / ('part-%02d.bin' % i) for i in range(5)]
          packed = b''.join(p.read_bytes() for p in chunks)
          assert len(packed) == 42828
          assert hashlib.sha256(packed).hexdigest() == '1b632e524d48437a211ff40ae5156640748b246cd9d44e2359b8ef9ae6ddc55e'
          dec = lzma.LZMADecompressor(memlimit=100000000)
          raw = dec.decompress(packed, max_length=235859)
          assert dec.eof and not dec.unused_data and len(raw) == 235858
          bundle = json.loads(raw)
          assert bundle['base'] == 'd775111a51fb2f66ba1f67406c511cc6d8abbf87'
          allowed = {
              'AGENTS.md', 'MANIFEST.sha256', 'README.md',
              'apps/admin-web/src/generated/requests.ts', 'apps/admin-web/src/main.tsx',
              'apps/admin-web/src/production-dto.ts', 'apps/admin-web/src/production-ui.tsx',
              'apps/admin-web/src/style.css', 'apps/admin-web/src/ui.tsx',
              'apps/api/src/prisma-store.ts', 'artifacts/openapi.json',
              'docs/release/IMPLEMENTATION_STATUS.md', 'docs/release/TEST_REPORT.md',
              'docs/release/WP1_WORKS_PROJECTS.md', 'packages/core/src/api.ts',
              'packages/core/src/model.ts', 'packages/core/src/portfolio.ts',
              'packages/core/src/production-model.ts', 'packages/core/src/production-policy.ts',
              'packages/core/src/production-validation.ts', 'packages/core/src/projects.ts',
              'packages/core/src/replay-policy.ts', 'packages/core/src/routes.ts',
              'prisma/migrations/202609240001_works_projects/migration.sql', 'prisma/schema.prisma',
              'scripts/generate-contract.ts', 'tests/acceptance/browser-production.mjs',
              'tests/core/production.test.ts', 'tests/postgres/integration.test.ts',
              'tests/postgres/production-contracts.ts', 'tests/support/memory-store.ts'
          }
          assert len(bundle['files']) == len(allowed) == 31
          assert {f['path'] for f in bundle['files']} == allowed
          prepared = {}
          for f in bundle['files']:
              rel = pathlib.PurePosixPath(f['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and str(rel) == f['path']
              assert f['path'] not in prepared
              path = root.joinpath(rel)
              assert not path.is_symlink() and all(not p.is_symlink() for p in path.parents if p != root.parent)
              old = path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if path.exists() else None) == f['before'], f['path']
              text = old.decode('utf-8')
              last_end = 0
              for e in f['edits']:
                  assert 0 <= last_end <= e['start'] <= e['end'] <= len(text)
                  last_end = e['end']
              for e in reversed(f['edits']):
                  text = text[:e['start']] + e['text'] + text[e['end']:]
              final = text.encode('utf-8')
              assert hashlib.sha256(final).hexdigest() == f['after'], f['path']
              prepared[f['path']] = final
          assert git('ls-remote', 'origin', branch).split()[0] == head
          for rel, data in prepared.items():
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          for path in chunks:
              path.unlink()
          # Workflow writes are performed only by the authorized connector, not this token.
          # Keep this temporary workflow untouched; the connector removes it after success.
          subprocess.run(['sha256sum', '-c', 'MANIFEST.sha256'], check=True)
          subprocess.run(['git', 'add', '--', *prepared, *(str(p) for p in chunks)], check=True)
          staged = set(git('diff', '--cached', '--name-only').splitlines())
          assert staged <= allowed | {str(p) for p in chunks}
          assert not any(p.startswith('.github/') for p in staged)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat(production): add internal works, credits and lightweight projects'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:' + branch], check=True)
          print('Applied 31 hash-verified non-workflow files and removed transfer chunks; no main or data changes.')
          PY
