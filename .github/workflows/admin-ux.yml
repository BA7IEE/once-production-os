name: ONCE admin UX acceptance
on:
  pull_request:
    branches: [codex/business-flow-fixes]
permissions:
  contents: read
concurrency:
  group: once-admin-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify delivery fingerprints
        run: sha256sum -c MANIFEST.sha256
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Contract, static checks and build
        run: pnpm contract:check && pnpm review:static && pnpm build
      - name: Resource supervision regression
        run: pnpm test:lifecycle
      - run: docker pull postgres:16-bookworm
      - name: Real PostgreSQL transactions and capacity
        run: pnpm test:postgres:owned --admin-ux
      - run: pnpm exec playwright install --with-deps chromium
      - name: Real admin journeys and existing business and portal regression
        run: pnpm test:postgres:owned --admin-ux-browser
      - name: Full types and core regression
        run: node scripts/heavy-task.mjs pnpm typecheck && node scripts/heavy-task.mjs pnpm test:core
      - name: Preserve current run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-ux-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/admin-ux/
            artifacts/business-flow/
            artifacts/talent-experience-pr02b/
            artifacts/core-test-report.json
            data/local-resource-runs/*/run.json
            data/local-resource-runs/*/process-*.json
            data/local-resource-runs/*/temporary-*.json
            data/local-resource-runs/*/browser-*.json
          if-no-files-found: error
