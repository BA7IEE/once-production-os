name: ONCE admin Foundation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: once-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  foundation:
    if: github.head_ref == 'codex/once-admin-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ONCE_ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: sha256sum -c MANIFEST.sha256
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Foundation admission, types and contract
        run: pnpm review:foundation && pnpm contract:check && node scripts/heavy-task.mjs pnpm typecheck
      - name: Targeted transport, selection, forms and lifecycle regressions
        run: |
          node --experimental-strip-types --test tests/core/admin-ux-inputs.test.ts tests/core/client-transport.test.ts tests/core/talent-directory-state.test.ts
          node --test tests/ui/admin-foundation.test.mjs
          pnpm test:lifecycle
      - name: Build current API and admin
        run: pnpm build
      - name: Build explicitly fictional static design review
        run: pnpm exec vite build --config apps/admin-web/design-review.config.ts
      - name: Package public frontend only with commit provenance
        run: |
          mkdir -p dist/web/design-review
          cp -R dist/design-review/assets dist/web/design-review/
          cp dist/design-review/design-review.html dist/web/design-review/index.html
          cp dist/design-review/once-components.css dist/web/design-review/once-components.css
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('dist/web')
          page=root/'design-review/index.html'
          page.write_text(page.read_text().replace('/assets/','/design-review/assets/'))
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert all(Path(p).suffix in {'.html','.js','.css'} for p in files), files.keys()
          (root/'preview-provenance.json').write_text(json.dumps({'head':os.environ['ONCE_ACCEPTANCE_SHA'],'data':'FICTIONAL_DESIGN_REVIEW_NO_BACKEND','files':files},indent=2))
          PY
      - name: Preserve public frontend build for loopback review
        uses: actions/upload-artifact@v7
        with:
          name: once-public-frontend-${{ github.event.pull_request.head.sha }}
          retention-days: 1
          path: dist/web/
          if-no-files-found: error
      - run: docker pull postgres:16-bookworm
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify fictional preview is actually visible without a backend
        run: node scripts/verify-design-preview.mjs
      - name: Real PostgreSQL and browser journeys on synthetic records
        run: pnpm test:postgres:owned --admin-ux-browser
      - name: Preserve JSON checks only, never screenshots or business payloads
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: once-foundation-checks-${{ github.event.pull_request.head.sha }}
          retention-days: 3
          path: |
            artifacts/design-review/browser.json
            artifacts/admin-ux/browser.json
            artifacts/admin-ux/browser-failure.json
            artifacts/business-flow/browser.json
            artifacts/talent-experience-pr02b/browser.json
            data/local-resource-runs/*/run.json
          if-no-files-found: warn
