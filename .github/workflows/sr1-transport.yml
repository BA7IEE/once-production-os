name: SR1 transport

on:
  push:
    branches: [feat/structured-search]
    paths: [.sr1-trigger]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/structured-search
          fetch-depth: 0
      - name: Remove temporary transfer file and rebuild manifest
        run: |
          test "$(cat .sr1-trigger)" = "cleanup"
          rm -rf .sl1-transfer .sr1-patch
          rm -f .sr1-trigger
          python3 - <<'PY'
from pathlib import Path
import subprocess, hashlib
skip={'MANIFEST.sha256','.github/workflows/sr1-transport.yml','.sr1-trigger'}
files=[]
for file in subprocess.check_output(['git','ls-files'],text=True).splitlines():
    if file in skip or file.startswith('.sl1-transfer/') or file.startswith('.sr1-patch/'):
        continue
    p=Path(file)
    if p.is_file():
        files.append(file)
files.sort()
Path('MANIFEST.sha256').write_text('\n'.join(f"{hashlib.sha256(Path(f).read_bytes()).hexdigest()}  {f}" for f in files)+'\n')
PY
          sha256sum -c MANIFEST.sha256
      - name: Commit final product fingerprints
        run: |
          git config user.name "David 老灯"
          git config user.email "32892836+BA7IEE@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "chore(search): clean transfer files and refresh fingerprints"
          git push origin HEAD:feat/structured-search
