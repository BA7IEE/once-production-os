name: SR1 transport

on:
  push:
    branches: [feat/structured-search]
    paths: [.sr1-trigger]

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/structured-search
          fetch-depth: 0
      - name: Apply prepared product patch or rebuild manifest
        run: |
          phase="$(cat .sr1-trigger)"
          git config user.name "David 老灯"
          git config user.email "32892836+BA7IEE@users.noreply.github.com"
          if [ "$phase" = "apply" ]; then
            cat .sr1-patch/p00 .sr1-patch/p01 .sr1-patch/p02 .sr1-patch/p03 .sr1-patch/p04 .sr1-patch/p05 | base64 -d | gzip -d > /tmp/sr1.patch
            echo "b49cbb7f36241aa497ffab8a59aba26a1bd8ad4788d3ee16ebdba1f58503e260  /tmp/sr1.patch" | sha256sum -c -
            git apply --check /tmp/sr1.patch
            git apply /tmp/sr1.patch
            rm -rf .sr1-patch
            git add -A
            git commit -m "feat(search): add structured talent search explanations"
            git push origin HEAD:feat/structured-search
          elif [ "$phase" = "manifest" ]; then
            python3 - <<'PY'
from pathlib import Path
import subprocess, hashlib
files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
skip={'MANIFEST.sha256','.github/workflows/sr1-transport.yml','.sr1-trigger'}
files=sorted(f for f in files if f not in skip and Path(f).is_file())
Path('MANIFEST.sha256').write_text('\n'.join(f"{hashlib.sha256(Path(f).read_bytes()).hexdigest()}  {f}" for f in files)+'\n')
PY
            sha256sum -c MANIFEST.sha256
            git add MANIFEST.sha256
            git commit -m "chore(search): refresh delivery fingerprints"
            git push origin HEAD:feat/structured-search
          else
            echo "unknown phase: $phase" >&2
            exit 2
          fi
