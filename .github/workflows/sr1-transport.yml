name: SR1 transport

on:
  push:
    branches: [feat/structured-search]
    paths: [.sr1-trigger]

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/structured-search
          fetch-depth: 0
      - name: Apply prepared structured-search patch
        run: |
          test "$(cat .sr1-trigger)" = "apply"
          cat .sr1-patch/p00 .sr1-patch/p01 .sr1-patch/p02 | base64 -d | gzip -d > /tmp/sr1.patch
          echo "60a253bd798b266fbbf18aef742d36e326060a2a7e3b4d1a7a7b2f1968bcf0b5  /tmp/sr1.patch" | sha256sum -c -
          git apply --check /tmp/sr1.patch
          cp .github/workflows/acceptance.yml /tmp/acceptance.yml
          git apply /tmp/sr1.patch
          cp /tmp/acceptance.yml .github/workflows/acceptance.yml
          rm -rf .sr1-patch
          rm -f .sr1-trigger
      - name: Commit product files
        run: |
          git config user.name "David 老灯"
          git config user.email "32892836+BA7IEE@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat(search): add structured talent search explanations"
          git push origin HEAD:feat/structured-search
