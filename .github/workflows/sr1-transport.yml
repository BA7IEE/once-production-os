name: SR1 transport

on:
  push:
    branches: [feat/structured-search]
    paths: [.sr1-trigger]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/structured-search
          fetch-depth: 0
      - name: Remove temporary transfer file and rebuild manifest
        run: |
          test "$(head -n 1 .sr1-trigger)" = "cleanup"
          rm -rf .sl1-transfer .sr1-patch
          rm -f .sr1-trigger
          python3 -c 'from pathlib import Path; import subprocess,hashlib; skip={"MANIFEST.sha256",".github/workflows/sr1-transport.yml",".sr1-trigger"}; fs=sorted(f for f in subprocess.check_output(["git","ls-files"],text=True).splitlines() if f not in skip and not f.startswith(".sl1-transfer/") and not f.startswith(".sr1-patch/") and Path(f).is_file()); Path("MANIFEST.sha256").write_text("\\n".join(f"{hashlib.sha256(Path(x).read_bytes()).hexdigest()}  {x}" for x in fs)+"\\n")'
          sha256sum -c MANIFEST.sha256
      - name: Commit final product fingerprints
        run: |
          git config user.name "David 老灯"
          git config user.email "32892836+BA7IEE@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "chore(search): clean transfer files and refresh fingerprints"
          git push origin HEAD:feat/structured-search
