name: Apply TD2 reviewed business slice
on:
  push:
    branches: [feat/talent-domain-2]
    paths: [.github/workflows/td2-review-source.yml]
permissions:
  contents: read
concurrency:
  group: once-td2-reviewed-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/talent-domain-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: once_ci
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: once_test_td2
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U once_ci -d once_test_td2" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Check previous source fingerprint and apply reviewed patch
        run: |
          python3 - <<'PY'
          import hashlib,lzma,pathlib,subprocess,os
          for line in pathlib.Path('MANIFEST.sha256').read_text().splitlines():
              expected,path=line.split('  ',1)
              if path=='.github/workflows/td2-review-source.yml': continue
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==expected, 'Preimage drift: '+path
          body=lzma.decompress(b''.join(pathlib.Path(f'.github/td2-business.{i}.xzpart').read_bytes() for i in range(4)))
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'td2-business.patch';patch.write_bytes(body)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          PY
      - name: Isolated disposable database configuration
        env:
          CI_DB_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          echo "::add-mask::$CI_DB_PASSWORD"
          echo "DATABASE_URL=postgresql://once_ci:$CI_DB_PASSWORD@127.0.0.1:5432/once_test_td2" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate && pnpm db:generate
      - run: pnpm contract:generate && pnpm typecheck
      - run: pnpm db:deploy
      - name: Core regressions before source commit
        run: node --experimental-strip-types --test --test-concurrency=4 tests/core/*.test.ts
      - name: Fast-forward reviewed source only
        run: |
          test "$(git ls-remote origin refs/heads/feat/talent-domain-2 | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --name-only -- .github/workflows)"
          git add -- packages/core/src scripts/generate-contract.ts tests/core/talent-v2.test.ts apps/admin-web/src/generated/requests.ts artifacts/openapi.json
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          files=sorted(p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and p!='MANIFEST.sha256')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in files))
          PY
          git add -- MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(td2): professional profiles, field evidence, role-aware selection and machine identity'
          git push origin HEAD:refs/heads/feat/talent-domain-2
