name: Apply reviewed TD2 prerequisites
on:
  push:
    branches: [feat/talent-domain-2]
    paths: [.github/workflows/td2-review-source.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/talent-domain-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: python3 .github/td2-apply-reviewed.py
      - name: Core regressions before source commit
        run: node --experimental-strip-types --test --test-concurrency=4 tests/core/*.test.ts
      - name: Commit only on unchanged draft development head
        run: |
          test "$(git ls-remote origin refs/heads/feat/talent-domain-2 | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/td2-apply-reviewed.py .github/workflows/td2-review-source.yml
          git add -- apps/api/src/recovery/safety-journal.ts scripts/recovery-approve.ts tests/core/safety-journal.test.ts .github/workflows/acceptance.yml
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          files=sorted(p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and p!='MANIFEST.sha256')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'  '+p+'\n' for p in files))
          PY
          git add -- MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(recovery): hold journal append barrier through approval commit'
          git push origin HEAD:refs/heads/feat/talent-domain-2
