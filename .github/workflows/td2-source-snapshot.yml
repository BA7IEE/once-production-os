name: TD2 source snapshot
on:
  push:
    branches: [feat/talent-domain-2]
    paths: [.github/workflows/td2-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/td2-source"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/td2-source/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/td2-source/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: td2-source
          path: ${{ runner.temp }}/td2-source/
          retention-days: 1
