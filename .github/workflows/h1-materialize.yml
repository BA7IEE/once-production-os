name: H1 one-time reviewed source transfer
on:
  push:
    branches: [feat/controlled-handoff]
    paths: ['.agent/h1/**']
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/controlled-handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify base and materialize exact reviewed files
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0c2da7dc6a9553afa3ef6904a34395cab6961875 HEAD
          python3 .agent/h1/materialize.py
          git rm -r -- .agent/h1
          git -c user.name='ONCE development bot' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(handoffs): apply reviewed H1 implementation and tests'
          git push origin HEAD:refs/heads/feat/controlled-handoff
