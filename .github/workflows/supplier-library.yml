name: ONCE supplier library acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: once-supplier-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ONCE_ACCEPTANCE_EVIDENCE_DIR: artifacts/once-upgrade/current/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Install native video fixture and media worker tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install isolated document parser and synthetic fixture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/once-document-python"
          "$RUNNER_TEMP/once-document-python/bin/pip" install -r tests/documents/requirements.txt
          echo "$RUNNER_TEMP/once-document-python/bin" >> "$GITHUB_PATH"
      - run: sha256sum -c MANIFEST.sha256
      - run: pnpm contract:check && pnpm typecheck && pnpm review:static
      - run: pnpm test:documents
      - run: pnpm test:lifecycle
      - run: docker pull postgres:16-bookworm
      - run: pnpm test:postgres:owned --supplier-fields
      - run: pnpm test:postgres:owned --supplier-inbox
      - run: pnpm test:postgres:owned --supplier-migration
      - run: pnpm test:postgres:owned --professional-homepages
      - run: pnpm test:postgres:owned --client-presentations
      - run: pnpm test:postgres:owned --project-selection
      - run: pnpm test:postgres:owned --supplier-directory
      - run: pnpm test:postgres:owned --supplier-library
      - run: pnpm test:postgres:owned --supplier-document-batches
      - run: pnpm test:postgres:owned --supplier-work-grouping
      - run: pnpm test:postgres:owned --supplier-upgrade
      - run: pnpm test:postgres:owned --supplier-scale
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-inbox pnpm test:postgres:owned --browser-suite supplier-inbox
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-migration pnpm test:postgres:owned --browser-suite supplier-migration
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-directory pnpm test:postgres:owned --browser-suite supplier-directory
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-project pnpm test:postgres:owned --browser-suite project-selection
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/professional-homepage/current/browser pnpm test:postgres:owned --browser-suite professional-homepages
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-client pnpm test:postgres:owned --browser-suite client-presentations
      - run: ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-documents pnpm test:postgres:owned --browser-suite supplier-library
      - run: ONCE_ACCEPTANCE_FIELDS=1 ONCE_ACCEPTANCE_UPGRADE=1 ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-fields pnpm test:postgres:owned --browser-suite supplier-library
      - run: ONCE_ACCEPTANCE_WORK_GROUPING=1 ONCE_ACCEPTANCE_EVIDENCE_DIR=artifacts/once-upgrade/current/browser-work-grouping pnpm test:postgres:owned --browser-suite supplier-library
      - name: Keep synthetic evidence and cleanup records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplier-library-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/supplier-library/
            artifacts/supplier-document-batches/
            artifacts/supplier-work-grouping/
            artifacts/supplier-field-templates/
            artifacts/once-upgrade/
            artifacts/professional-homepage/
            data/local-resource-runs/*/run.json
            data/local-resource-runs/*/process-*.json
            data/local-resource-runs/*/temporary-*.json
            data/local-resource-runs/*/browser-*.json
          if-no-files-found: error
