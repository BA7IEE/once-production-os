name: Apply reviewed TD2 maintenance slice
on:
  push:
    branches: [feat/talent-domain-2]
    paths: [.github/workflows/td2-maintenance-apply.yml]
permissions:
  contents: read
concurrency:
  group: once-td2-reviewed-maintenance
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/talent-domain-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: once_ci
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: once_test_td2_maintenance_apply
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U once_ci -d once_test_td2_maintenance_apply" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Verify original delivery and exact reviewed patch
        run: |
          sha256sum -c MANIFEST.sha256
          python3 - <<'PY'
          import gzip, hashlib, os, pathlib, subprocess
          parts = ['0a', '0b', '0c', '1', '2', '3']
          data = b''.join(pathlib.Path('.github/td2-maintenance.' + i + '.gzpart').read_bytes() for i in parts)
          assert hashlib.sha256(data).hexdigest() == '31f2a6ea7c8d7e9061a5851f17729d14d0b6ae46d965c0daa740fbb417b542c0', 'Compressed patch differs'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'b4df6f84414bed015dc8ab263754b73a1bb21ff2da7ce8c16398075dd85976b0', 'Reviewed patch differs'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'td2-maintenance.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Isolated disposable database configuration
        env:
          CI_DB_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          echo "::add-mask::$CI_DB_PASSWORD"
          echo "DATABASE_URL=postgresql://once_ci:$CI_DB_PASSWORD@127.0.0.1:5432/once_test_td2_maintenance_apply" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=postgresql://once_ci:$CI_DB_PASSWORD@127.0.0.1:5432/once_test_td2_maintenance_apply" >> "$GITHUB_ENV"
          echo 'ALLOW_DB_TESTS=yes' >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate && pnpm db:generate
      - run: pnpm contract:generate && pnpm typecheck && pnpm typecheck:transport
      - name: Repeat all core regressions
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=4 tests/core/*.test.ts | tee "$RUNNER_TEMP/td2-maintenance-core.log"
      - name: Real PostgreSQL and DB-media restore with typed talent facts
        run: |
          set -o pipefail
          pnpm db:deploy
          pnpm verify:postgres | tee "$RUNNER_TEMP/td2-maintenance-postgres.log"
      - name: Remove completed one-shot helpers and regenerate complete fingerprints
        run: |
          git rm -- .github/td2-apply-reviewed.py .github/td2-business.0.xzpart .github/td2-business.1.xzpart .github/td2-business.2.xzpart .github/td2-business.3.xzpart .github/td2-foundation-generator.py.gz .github/workflows/td2-review-source.yml .github/workflows/td2-source-snapshot.yml
          git rm -- .github/td2-maintenance.0a.gzpart .github/td2-maintenance.0b.gzpart .github/td2-maintenance.0c.gzpart .github/td2-maintenance.1.gzpart .github/td2-maintenance.2.gzpart .github/td2-maintenance.3.gzpart .github/workflows/td2-maintenance-apply.yml
          git add -- AGENTS.md docs/release/IMPLEMENTATION_STATUS.md docs/release/TD2_MAINTENANCE_STATUS.md docs/release/TEST_REPORT.md packages/core/src/deletion-cleanup.ts packages/core/src/deletion-finalization.ts packages/core/src/deletion-model.ts packages/core/src/deletions.ts packages/core/src/exports.ts packages/core/src/person-merges.ts packages/core/src/rebuild-model.ts packages/core/src/recovery-model.ts packages/core/src/recovery.ts packages/core/src/talent-v2-erasure.ts packages/core/src/talent-v2-integrity.ts packages/core/src/talent-v2-search.ts scripts/verify-postgres.mjs tests/core/talent-v2-maintenance.test.ts tests/core/talent-v2-search.test.ts tests/postgres/recovery-approval.test.ts tests/postgres/talent-v2-maintenance.test.ts tests/support/talent-v2-maintenance.ts apps/admin-web/src/generated/requests.ts artifacts/openapi.json
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          paths = sorted(p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p and p != 'MANIFEST.sha256')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ' + p + '\n' for p in paths))
          PY
          git add -- MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git diff --cached --check
          git diff --exit-code
      - name: Fast-forward only the existing draft branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/talent-domain-2 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(td2): typed talent erasure, restore integrity and role-bound search'
          git push origin HEAD:refs/heads/feat/talent-domain-2
          git rev-parse HEAD > "$RUNNER_TEMP/td2-maintenance-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: td2-maintenance-evidence
          path: |
            ${{ runner.temp }}/td2-maintenance-core.log
            ${{ runner.temp }}/td2-maintenance-postgres.log
            ${{ runner.temp }}/td2-maintenance-head.txt
          retention-days: 7
