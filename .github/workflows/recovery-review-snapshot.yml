name: Apply reviewed recovery fix
on:
  push:
    branches: [feat/recovery-delta-resolution]
    paths: [.github/workflows/recovery-review-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: once-reviewed-recovery-fix
  cancel-in-progress: false
jobs:
  apply-reviewed:
    if: github.repository == 'BA7IEE/once-production-os' && github.ref == 'refs/heads/feat/recovery-delta-resolution'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Apply only the reviewed preimage-pinned source changes
        run: python3 .github/recovery-reviewed-apply.py
      - name: Repeat all core tests without writing tracked artifacts
        run: |
          set -o pipefail
          node --experimental-strip-types --test --test-concurrency=3 tests/core/*.test.ts | tee "$RUNNER_TEMP/reviewed-core.log"
      - name: Regenerate complete fingerprints and remove this one-shot helper
        run: |
          git rm -- .github/recovery-reviewed-apply.py .github/workflows/recovery-review-snapshot.yml
          git add -- packages/core/src/safety-intent.ts apps/api/src/recovery/safety-journal.ts packages/core/src/api.ts apps/api/src/worker-main.ts apps/api/src/deletion/finalizer.ts tests/core/recovery-delta.test.ts tests/core/safety-intent.test.ts docs/release/IMPLEMENTATION_STATUS.md
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          paths = sorted(p for p in paths if p and p != 'MANIFEST.sha256')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ' + p + '\n' for p in paths))
          allowed = {'packages/core/src/safety-intent.ts', 'apps/api/src/recovery/safety-journal.ts', 'packages/core/src/api.ts', 'apps/api/src/worker-main.ts', 'apps/api/src/deletion/finalizer.ts', 'tests/core/recovery-delta.test.ts', 'tests/core/safety-intent.test.ts', 'docs/release/IMPLEMENTATION_STATUS.md', '.github/recovery-reviewed-apply.py', '.github/workflows/recovery-review-snapshot.yml'}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert staged <= allowed, 'Unexpected staged paths: ' + repr(staged - allowed)
          PY
          git add -- MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git diff --cached --check
      - name: Fast-forward only the existing draft branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/recovery-delta-resolution | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(recovery): bind audit evidence to requests and preserve ambiguous outcomes'
          git push origin HEAD:refs/heads/feat/recovery-delta-resolution
          git rev-parse HEAD | tee "$RUNNER_TEMP/reviewed-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-recovery-core
          path: |
            ${{ runner.temp }}/reviewed-core.log
            ${{ runner.temp }}/reviewed-head.txt
          retention-days: 7
